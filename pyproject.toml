[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pcsaft"
version = "0.2.0"
description = "PC-SAFT for pure components: density and saturation pressure"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
include = ["pcsaft*"]
